services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capacity
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d capacity']
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.1
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - '9092:9092'

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/capacity
      KAFKA_BROKER: redpanda:9092
      JWT_SECRET: local-dev-secret-change-in-production
    restart: unless-stopped

volumes:
  pgdata:
